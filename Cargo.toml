[package]
name = "thermalacuarium"
version = "0.8.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_10"] }
libc = "0.2.190"
cairo-rs = { version = "0.22.9", features = ["png"] }

[profile.release]
strip = true
